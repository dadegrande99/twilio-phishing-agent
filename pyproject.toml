[project]
name = "whatsapp-phishing-agent"
version = "0.1.0"
description = "PoC: WhatsApp phishing/impersonation analysis agent (LangGraph + FastAPI, Twilio or Meta Cloud API)"
authors = [
    { name = "dadegrande99", email = "davidegrandesso@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.17",
    "langsmith>=0.14.12",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "twilio>=9.12.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: chiama API reali (Anthropic), costa denaro"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
